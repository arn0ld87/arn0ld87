# Contribution Snake
#
# Rendert den GitHub-Contribution-Graph als animiertes SVG im Farbschema
# dieses Profils und legt das Ergebnis im Branch `output` ab. Die README
# laedt es von dort ueber raw.githubusercontent.com.
#
# Was der Workflow anfasst:
#   - liest den oeffentlichen Contribution-Graph von arn0ld87 (GITHUB_TOKEN)
#   - schreibt ausschliesslich in den Branch `output`
#   - der Branch `main` wird nie beschrieben
#
# Rechte: `contents: write` ist das Minimum fuer den Push nach `output`.
# Alle uebrigen Scopes sind global auf `none` gesetzt. Keine Secrets noetig,
# der automatisch bereitgestellte GITHUB_TOKEN reicht.
#
# Actions sind auf den Commit-SHA des jeweiligen Releases gepinnt, damit ein
# verschobener Tag keinen fremden Code in den Lauf holen kann.

name: snake

on:
  schedule:
    # taeglich 03:17 UTC - krumme Minute, um den Zeitplan-Peak zu meiden
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ausschliesslich fuer den Push in den Branch `output`
    timeout-minutes: 10

    steps:
      - name: SVG aus dem Contribution-Graph rendern
        # Platane/snk v3.5.0
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00C2FF&color_dots=#0B1015,#123049,#1A5C8A,#2388FF,#00C2FF
            dist/snake-light.svg?color_snake=#0B63C8&color_dots=#EEF2F6,#C9DCF2,#8FBCE8,#3F8ADE,#0B63C8

      - name: Ergebnis nach `output` pushen
        # crazy-max/ghaction-github-pages v5.0.0
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
